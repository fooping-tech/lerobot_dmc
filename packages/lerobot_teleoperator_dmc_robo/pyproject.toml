[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_teleoperator_dmc_robo"
version = "0.0.0"
description = "LeRobot teleoperator config for dmc_robo UI defaults."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "lerobot",
  "eclipse-zenoh",
  "PySide6",
  "pyqtgraph",
  "pyserial",
]

[tool.setuptools]
packages = ["lerobot_teleoperator_dmc_robo"]
